[project]
name = "consorzio"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "m-contini", email = "marcontini.93@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "colorama>=0.4.6",
    "duckdb>=2.0.0",
    "google-cloud-storage>=3.17.1",
    "inquirerpy>=0.3.4",
    "lxml>=6.1.3",
    "pandas>=3.1.0",
    "prompt-toolkit>=3.0.53",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "tabulate>=0.10.0",
    "xlsxwriter>=3.3.1",
]

[project.scripts]
consorzio = "consorzio:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
