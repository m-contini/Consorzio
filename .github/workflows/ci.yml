name: Consorzio Birre CI

# Trigger: push e pull request
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  run-tests:
    runs-on: ubuntu-latest # Ultima versione presente su GitHub

    steps:
      - name: Controlla il codice della repo
        uses: actions/checkout@v4

      - name: Configura Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Installa le dipendenze
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Esegui test
        run: |
          pytest -vv
